[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BB_LDPC"
version = "0.1.0"
dependencies = [
    "numpy",
    "stim",
    "matplotlib",
    "ncon",
    "scipy",
    "galois",
    "ldpc"
]


[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v"
testpaths = ["tests"]
